services:
  - type: web
    name: synnical
    env: docker
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: file:./db/custom.db
      - key: NEXT_PUBLIC_SOCKET_URL
        value: /socket.io
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
