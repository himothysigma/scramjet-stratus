services:
  - type: web
    name: synnical
    env: docker
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        value: /socket.io
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
